<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <rect width="240" height="240" rx="28" fill="#0A0A0A"/>

  <!-- Spine -->
  <line x1="68" y1="56" x2="68" y2="184" stroke="#FAFAFA" stroke-width="24" stroke-linecap="square"/>

  <!-- Upper arm: spine-mid to top-right -->
  <line x1="76" y1="124" x2="172" y2="56" stroke="#FAFAFA" stroke-width="24" stroke-linecap="square"/>

  <!-- Lower arm part A: spine-mid heading toward bottom-right, stops before break -->
  <line x1="76" y1="124" x2="118" y2="154" stroke="#FAFAFA" stroke-width="24" stroke-linecap="square"/>

  <!-- Lower arm part B: resumes after break, continues to bottom-right -->
  <line x1="134" y1="166" x2="184" y2="202" stroke="#FAFAFA" stroke-width="24" stroke-linecap="square"/>

  <!-- Accent: cyan trace bridging the break, same angle as the stroke -->
  <line x1="118" y1="154" x2="134" y2="166" stroke="#4ADEFF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="118" cy="154" r="4.5" fill="#4ADEFF"/>
  <circle cx="134" cy="166" r="4.5" fill="#4ADEFF"/>
</svg>
